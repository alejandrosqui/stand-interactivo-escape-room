name: stand-interactivo

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stand_interactivo}
      POSTGRES_USER: ${POSTGRES_USER:-stand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]

  backend:
    image: stand-interactivo-backend:${APP_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stand}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stand_interactivo}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://stand.patagoniasoftware.com.ar}
      CORS_ORIGIN_REGEX: "^$"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]

  web:
    image: stand-interactivo-web:${APP_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:?Defina ADMIN_USER en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: stand_interactivo_postgres_data
